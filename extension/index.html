<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="在新标签页或侧栏中打开 KeepDo，管理目标、习惯、待办与成长日记。" />
    <title>KeepDo · 每日行动与目标沉淀</title>
    <link rel="icon" href="./icons/icon-32.png" />
    <link rel="stylesheet" href="./style.css" />
    <script type="module" src="./shell.js"></script>
  </head>
  <body class="flex h-dvh min-w-72 flex-col overflow-hidden bg-slate-50 font-sans text-slate-800 antialiased dark:bg-slate-950 dark:text-slate-100">
    <header class="flex min-h-14 shrink-0 items-center justify-between gap-3 border-b border-slate-200/70 bg-white/90 px-4 dark:border-slate-800 dark:bg-slate-900/90">
      <h1 class="text-base font-bold tracking-tight text-indigo-600 dark:text-indigo-400">KeepDo</h1>
      <nav aria-label="扩展操作" class="flex items-center gap-1 text-xs font-medium">
        <button id="extension-reload" type="button" class="min-h-10 rounded-lg px-3 transition-colors hover:bg-slate-100 focus-visible:outline-2 focus-visible:outline-indigo-500 motion-reduce:transition-none dark:hover:bg-slate-800">重新加载</button>
        <a id="extension-open-web" href="https://keepdo.shindouhiro.workers.dev/" target="_blank" rel="noopener noreferrer" class="inline-flex min-h-10 items-center rounded-lg px-3 text-indigo-600 transition-colors hover:bg-indigo-50 focus-visible:outline-2 focus-visible:outline-indigo-500 motion-reduce:transition-none dark:text-indigo-400 dark:hover:bg-indigo-950">在网页中打开 ↗</a>
      </nav>
    </header>
    <main class="relative min-h-0 flex-1">
      <div id="extension-content" class="h-full" hidden></div>
      <section id="extension-connection" aria-label="连接状态" class="absolute inset-0 flex items-center justify-center p-6">
        <div class="max-w-sm text-center">
          <div id="extension-loading" role="status" aria-live="polite">
            <div aria-hidden="true" class="mx-auto mb-5 size-8 animate-spin rounded-full border-2 border-indigo-200 border-t-indigo-600 motion-reduce:animate-none dark:border-indigo-900 dark:border-t-indigo-400"></div>
            <h2 class="text-lg font-semibold">正在打开你的个人空间</h2>
            <p class="mt-3 text-sm leading-6 text-slate-500 dark:text-slate-400">正在连接 KeepDo 账号服务…</p>
          </div>
          <div id="extension-error" hidden>
            <h2 class="text-lg font-semibold">暂时无法连接 KeepDo</h2>
            <p id="extension-error-message" role="alert" class="mt-3 text-sm leading-6 text-slate-500 dark:text-slate-400"></p>
            <button id="extension-retry" type="button" class="mt-6 min-h-11 rounded-xl bg-indigo-600 px-5 text-sm font-semibold text-white transition-colors hover:bg-indigo-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-500 motion-reduce:transition-none">重新连接</button>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
