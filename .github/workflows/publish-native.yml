name: 发布 KeepDo 原生安装包

on:
  workflow_run:
    workflows: [构建 KeepDo 原生客户端]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 已成功构建的发布标签，例如 v1.0.2
        required: true
        type: string
      run_id:
        description: 对应标签的原生构建运行 ID
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: native-release-${{ github.event.workflow_run.head_branch || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       (startsWith(github.event.workflow_run.head_branch, 'v') ||
        startsWith(github.event.workflow_run.head_branch, 'native-v')))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - name: 检出默认分支的发布脚本
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 校验标签、构建来源与产物
        id: source
        uses: actions/github-script@v7
        env:
          INPUT_TAG: ${{ inputs.tag || github.event.workflow_run.head_branch }}
          INPUT_RUN_ID: ${{ inputs.run_id || github.event.workflow_run.id }}
        with:
          script: |
            const { nativePackages, releaseVersion, validateNativeRun } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/lib/native-release.mjs`)
            const tag = process.env.INPUT_TAG
            const version = releaseVersion(tag)
            const runId = process.env.INPUT_RUN_ID
            if (!/^\d+$/.test(runId)) throw new Error('构建运行 ID 必须是数字')
            const repository = `${context.repo.owner}/${context.repo.repo}`
            const { data: run } = await github.rest.actions.getWorkflowRun({ ...context.repo, run_id: Number(runId) })
            validateNativeRun(run, tag, repository)
            const { data: ref } = await github.rest.git.getRef({ ...context.repo, ref: `tags/${tag}` })
            let object = ref.object
            for (let depth = 0; object.type === 'tag' && depth < 5; depth++) {
              const { data } = await github.rest.git.getTag({ ...context.repo, tag_sha: object.sha })
              object = data.object
            }
            if (object.type !== 'commit' || object.sha !== run.head_sha) throw new Error('标签与构建提交不一致')
            const { data: manifest } = await github.rest.repos.getContent({ ...context.repo, path: 'package.json', ref: run.head_sha })
            const pkg = JSON.parse(Buffer.from(manifest.content, 'base64').toString('utf8'))
            if (pkg.version !== version) throw new Error('标签与应用版本不一致')
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, { ...context.repo, run_id: run.id, per_page: 100 })
            for (const name of new Set(nativePackages.map(item => item.artifact))) {
              if (artifacts.filter(item => item.name === name && !item.expired).length !== 1) throw new Error(`构建产物缺失或重复：${name}`)
            }
            core.setOutput('tag', tag)
            core.setOutput('run_id', String(run.id))
      - name: 下载该标签已经验证的构建产物
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.run_id }}
          pattern: keepdo-*
          path: native-artifacts
      - name: 收集安装包并生成校验和
        env:
          RELEASE_TAG: ${{ steps.source.outputs.tag }}
        run: node scripts/collect-native-release.mjs native-artifacts release-assets "$RELEASE_TAG"
      - name: 附加安装包到对应 Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.source.outputs.tag }}
        run: |
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag \
              --title "KeepDo $RELEASE_TAG" --notes-file docs/release-notes.md || \
              gh release view "$RELEASE_TAG" > /dev/null
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          gh release edit "$RELEASE_TAG" --title "KeepDo $RELEASE_TAG" --notes-file docs/release-notes.md
          gh release view "$RELEASE_TAG" --json assets > published-assets.json
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto'
          import { readFileSync, readdirSync, statSync } from 'node:fs'
          import assert from 'node:assert/strict'
          const { assets } = JSON.parse(readFileSync('published-assets.json', 'utf8'))
          for (const name of readdirSync('release-assets')) {
            const path = `release-assets/${name}`
            const asset = assets.find(item => item.name === name)
            assert.ok(asset && asset.state === 'uploaded', `附件未上传：${name}`)
            assert.equal(asset.size, statSync(path).size, `附件大小不符：${name}`)
            if (asset.digest) assert.equal(asset.digest, `sha256:${createHash('sha256').update(readFileSync(path)).digest('hex')}`, `附件校验和不符：${name}`)
            console.log(`Release 附件验证通过：${name}`)
          }
          NODE
