name: Build Chrome Extension

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: extension-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-extension:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 检查发布版本
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          pnpm exec node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const { version } = JSON.parse(readFileSync('extension/manifest.json', 'utf8'))
          if (process.env.GITHUB_REF_NAME !== `v${version}`) {
            throw new Error(`发布标签必须与扩展版本一致：v${version}`)
          }
          NODE

      - name: 运行单元测试
        run: pnpm test

      - name: 构建 Chrome 扩展安装包
        run: pnpm build:extension

      - name: 检查安装包完整性
        run: unzip -t dist-extension.zip

      - name: 上传 Chrome 扩展安装包
        uses: actions/upload-artifact@v7
        with:
          path: dist-extension.zip
          archive: false
          if-no-files-found: error
          retention-days: 30

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-extension
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: 检出发布说明
        uses: actions/checkout@v4
      - name: 下载已验证的扩展安装包
        uses: actions/download-artifact@v8
        with:
          name: dist-extension.zip
          skip-decompress: true

      - name: 检查下载的安装包
        run: unzip -t dist-extension.zip

      - name: 发布到 GitHub Releases
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist-extension.zip --clobber
          else
            gh release create "$RELEASE_TAG" dist-extension.zip \
              --verify-tag --latest \
              --title "KeepDo $RELEASE_TAG" \
              --notes-file docs/release-notes.md || {
                gh release view "$RELEASE_TAG" > /dev/null
                gh release upload "$RELEASE_TAG" dist-extension.zip --clobber
              }
          fi
